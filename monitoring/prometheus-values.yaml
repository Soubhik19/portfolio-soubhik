# ── Prometheus config ─────────────────────────────────
prometheus:
  prometheusSpec:
    # How long to keep metrics data
    retention: 7d

    # Resource limits suitable for Minikube
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Scrape your portfolio pods (picks up prometheus.io/scrape annotations)
    additionalScrapeConfigs:
      - job_name: "portfolio"
        static_configs:
          - targets: ["portfolio-service.portfolio.svc.cluster.local:80"]
        metrics_path: /metrics
        scrape_interval: 15s

# ── Grafana config ────────────────────────────────────
grafana:
  enabled: true

  # Change this password!
  adminPassword: "portfolio@123"

  # Resource limits for Minikube
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Pre-load dashboards automatically
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  # Auto-import these community dashboards
  dashboards:
    default:
      # Kubernetes cluster overview
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

      # Pod resource usage
      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

      # Nginx ingress metrics
      nginx-ingress:
        gnetId: 9614
        revision: 1
        datasource: Prometheus

  # Grafana ini settings
  grafana.ini:
    server:
      root_url: "http://localhost:3001"

# ── Alertmanager config ───────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# ── Node exporter (host metrics) ─────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics (K8s object metrics) ──────────
kubeStateMetrics:
  enabled: true

# ── Disable components that need special Minikube setup
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
