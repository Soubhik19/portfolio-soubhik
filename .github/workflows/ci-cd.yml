name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-soubhik

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Lint and build the React app
  # ─────────────────────────────────────────
  build-app:
    name: Build React App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2 — Build and push Docker image
  # ─────────────────────────────────────────
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-app       # only runs if job 1 passes

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sha.outputs.short }}
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}  # only push on main
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # GitHub Actions cache
          cache-to: type=gha,mode=max

      - name: Image digest summary
        run: |
          echo "### Docker Image Built ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 3 — Test the Docker image works
  # ─────────────────────────────────────────
  test-docker:
    name: Smoke Test Docker Image
    runs-on: ubuntu-latest
    needs: build-docker     # only runs if job 2 passes

    steps:
      - name: Pull and run image
        run: |
          docker run -d \
            --name portfolio-test \
            -p 8080:80 \
            ${{ env.IMAGE_NAME }}:latest
          sleep 5

      - name: Test health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed (HTTP $response)"
          else
            echo "❌ Health check failed (HTTP $response)"
            exit 1
          fi

      - name: Test main page loads
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$response" = "200" ]; then
            echo "✅ Main page loaded (HTTP $response)"
          else
            echo "❌ Main page failed (HTTP $response)"
            exit 1
          fi

      - name: Cleanup
        run: docker stop portfolio-test && docker rm portfolio-test

  # ─────────────────────────────────────────
  # JOB 4 — Notify ready to deploy
  # ─────────────────────────────────────────
  notify:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: test-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "### 🚀 Ready to Deploy!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image is built and tested. Run this on your machine to deploy:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "eval \$(minikube docker-env)" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/portfolio portfolio=${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }} -n portfolio" >> $GITHUB_STEP_SUMMARY
          echo "kubectl rollout status deployment/portfolio -n portfolio" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
